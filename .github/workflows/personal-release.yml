name: Personal release

# Fork-only release workflow: builds unsigned desktop installers for mac,
# linux, and windows and attaches them to a GitHub Release. This does not use
# any of pingdotgg's org infra (Clerk auth, Cloudflare relay, code-signing
# certs, Vercel, AUR, Discord) — see .github/workflows/release.yml for that.
# Friends install an unsigned build and click through one OS security prompt.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on the build (for example 1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  resolve_version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$DISPATCH_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like 1.2.3, got: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: resolve_version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            runner: macos-14
            platform: mac
            target: dmg
            arch: universal
            rust_targets: "aarch64-apple-darwin x86_64-apple-darwin"
          - label: Linux
            runner: ubuntu-latest
            platform: linux
            target: AppImage
            arch: x64
            rust_targets: "x86_64-unknown-linux-gnu"
          - label: Windows
            runner: windows-latest
            platform: win
            target: nsis
            arch: x64
            rust_targets: "x86_64-pc-windows-msvc"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: ${{ matrix.platform != 'win' }}
          run-install: false

      - name: Install dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - uses: ./.github/actions/setup-apt-mirrors
        if: matrix.platform == 'linux'

      - name: Install Linux desktop build libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
              sudo apt-get install -y imagemagick
          fi

      # build-desktop-artifact.ts refuses to package a Windows build unless the
      # Spectre-mitigated VC runtime libs are present, signed or not.
      - name: Install Spectre-mitigated MSVC libs
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Align package versions
        shell: bash
        env:
          VERSION: ${{ needs.resolve_version.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$VERSION"

      - name: Build desktop artifact
        shell: bash
        env:
          VERSION: ${{ needs.resolve_version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          vp run dist:desktop:artifact \
            --platform "$PLATFORM" \
            --target "$TARGET" \
            --arch "$ARCH" \
            --build-version "$VERSION" \
            --verbose

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for file in release/*.dmg release/*.AppImage release/*.exe; do
            cp "$file" release-publish/
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          path: release-publish/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [resolve_version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: desktop-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve_version.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            git tag "$tag"
            git push origin "$tag"
          fi
          gh release create "$tag" release-assets/* \
            --title "T4 Code $VERSION" \
            --generate-notes
